name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PhysicianWorker.slnx

      - name: Build
        run: dotnet build PhysicianWorker.slnx -c Release --no-restore

      - name: Build Docker image
        run: docker build -f PhysicianWorker.Worker/Dockerfile -t physicianworker-worker:ci .
