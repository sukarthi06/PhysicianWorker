name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }} --resource-group ${{ vars.RG_NAME }}
          docker buildx build -f PhysicianWorker.Worker/Dockerfile \
            -t ${{ vars.ACR_NAME }}.azurecr.io/physician-worker-comp:${{ github.event.workflow_run.head_sha }} \
            --push .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/physician-worker-comp:${{ github.event.workflow_run.head_sha }}