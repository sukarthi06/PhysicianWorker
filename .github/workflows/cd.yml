name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }} --resource-group ${{ vars.RG_NAME }}
          docker buildx build -f PhysicianWorker.Worker/Dockerfile \
            -t ${{ vars.ACR_LOGIN_SERVER }}/physician-worker-comp:${{ github.event.workflow_run.head_sha }} \
            --push .

      - name: Configure ACR pull authentication
        run: |
          az containerapp registry set \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --identity system \
            --server ${{ vars.ACR_LOGIN_SERVER }}

      - name: Set RabbitMQ password as Container App secret
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          az containerapp secret set \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --secrets "rabbitmq-password=$RABBITMQ_PASSWORD"

      - name: Deploy to Container App
        env:
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
        run: |
          az containerapp update \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/physician-worker-comp:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "RabbitMQ__Host=$RABBITMQ_HOST" \
              "RabbitMQ__Port=5671" \
              "RabbitMQ__VirtualHost=$RABBITMQ_VHOST" \
              "RabbitMQ__Username=$RABBITMQ_USERNAME" \
              "RabbitMQ__Password=secretref:rabbitmq-password"
