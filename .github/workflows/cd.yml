name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: physician-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }} --resource-group ${{ vars.RG_NAME }}
          docker buildx build -f PhysicianWorker.Worker/Dockerfile \
            -t ${{ vars.ACR_LOGIN_SERVER }}/physician-worker-comp:${{ github.event.workflow_run.head_sha }} \
            --push .

      - name: Wait for any active Container App operation
        run: |
          for attempt in {1..60}; do
            state="$(az containerapp show --name physician-worker --resource-group ${{ vars.RG_NAME }} --query properties.provisioningState --output tsv)"
            case "$state" in
              Succeeded) exit 0 ;;
              Failed) echo "Container App is in a failed provisioning state."; exit 1 ;;
              *) echo "Container App provisioning state: $state. Waiting..."; sleep 10 ;;
            esac
          done
          echo "Timed out waiting for the Container App to become ready."
          exit 1

      - name: Configure ACR pull authentication
        run: |
          az containerapp registry set \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --identity system \
            --server ${{ vars.ACR_LOGIN_SERVER }}

      - name: Wait for registry configuration
        run: |
          for attempt in {1..60}; do
            state="$(az containerapp show --name physician-worker --resource-group ${{ vars.RG_NAME }} --query properties.provisioningState --output tsv)"
            case "$state" in
              Succeeded) exit 0 ;;
              Failed) echo "Registry configuration failed."; exit 1 ;;
              *) echo "Container App provisioning state: $state. Waiting..."; sleep 10 ;;
            esac
          done
          echo "Timed out waiting for registry configuration."
          exit 1

      - name: Set RabbitMQ password as Container App secret
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          az containerapp secret set \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --secrets "rabbitmq-password=$RABBITMQ_PASSWORD"

      - name: Wait for secret update
        run: |
          for attempt in {1..60}; do
            state="$(az containerapp show --name physician-worker --resource-group ${{ vars.RG_NAME }} --query properties.provisioningState --output tsv)"
            case "$state" in
              Succeeded) exit 0 ;;
              Failed) echo "Secret update failed."; exit 1 ;;
              *) echo "Container App provisioning state: $state. Waiting..."; sleep 10 ;;
            esac
          done
          echo "Timed out waiting for secret update."
          exit 1

      - name: Deploy to Container App
        env:
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
        run: |
          az containerapp update \
            --name physician-worker \
            --resource-group ${{ vars.RG_NAME }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/physician-worker-comp:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "RabbitMQ__Host=$RABBITMQ_HOST" \
              "RabbitMQ__Port=5671" \
              "RabbitMQ__VirtualHost=$RABBITMQ_VHOST" \
              "RabbitMQ__Username=$RABBITMQ_USERNAME" \
              "RabbitMQ__Password=secretref:rabbitmq-password"
